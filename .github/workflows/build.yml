name: build

# Builds the franklinwh CLI for Linux and Windows (x64) and the Android app.
# Runs on pushes to the default branch, on pull requests, on version tags,
# and on demand.
# A release (the binaries and the APK on a GitHub Release) is published by
# either pushing a tag like v0.1.0, or running this workflow from the Actions
# tab ("Run workflow") on main with a version: that builds main, then tags the
# built commit and publishes the release.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to tag and publish, e.g. v0.2.0 (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: '0' # pure Go, so one Linux runner cross-compiles both targets
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          out="dist/franklinwh-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          ldflags="-s -w"
          # Link the Windows binary for the GUI subsystem so double-clicking it
          # opens the dashboard without a console window flashing up.
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ldflags="$ldflags -H=windowsgui"
          fi
          go build -trimpath -ldflags "$ldflags" -o "$out" ./cmd/franklinwh
          echo "built $out"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: franklinwh-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # Builds the Android app: the AAR from ./mobile with gomobile, then a
  # debug-signed APK with Gradle. The runner image ships the Android SDK and
  # NDK (ANDROID_HOME and ANDROID_NDK_HOME).
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build AAR
        run: scripts/build-aar.sh
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Collect outputs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/franklinwh-android-debug.apk
          cp android/app/libs/franklinwh.aar dist/franklinwh-android.aar
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: franklinwh-android
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and release and upload the binaries
    steps:
      - name: Choose tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" != workflow_dispatch ]; then
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            exit 0
          fi
          # Run from the Actions tab: release main under a new version tag.
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run the workflow on main to publish a release (got $GITHUB_REF)"
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like v1.2.3 (got '$VERSION')"
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi
          echo "TAG=${VERSION}" >> "$GITHUB_ENV"
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --target creates the tag on the built commit when it does not
          # exist yet (a release started from the Actions tab).
          gh release create "$TAG" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "$TAG" \
            --generate-notes
